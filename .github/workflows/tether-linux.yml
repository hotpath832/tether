name: Tether Linux build

# Builds tether-<ver>.deb (x86_64) on GitHub's Ubuntu runners. Runs on push to
# the feature branch and via the manual "Run workflow" button.
on:
  workflow_dispatch:
  push:
    branches: [feat/linux-macos-builds]
    paths:
      - '.github/workflows/tether-linux.yml'
      - 'src/**'
      - 'flutter/**'
      - 'res/**'
      - 'build.py'
      - 'Cargo.*'
      - 'hbb_common_fork.patch'
      - 'vcpkg.json'

jobs:
  build:
    # 22.04 keeps the glibc requirement low enough for most current distros.
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      FLUTTER_VERSION: 3.24.5
      VCPKG_TRIPLET: x64-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false   # hbb_common is set up manually to apply the crypto patch

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # --- hbb_common fork (base a920d00 + our X25519 crypto patch) ---
      - name: Populate hbb_common and apply crypto fork patch
        run: |
          git submodule update --init libs/hbb_common
          git -C libs/hbb_common apply "$GITHUB_WORKSPACE/hbb_common_fork.patch"
          test -f libs/hbb_common/src/crypto.rs && echo "crypto fork applied"

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          # The runner image ships libunwind-14-dev, which blocks libunwind-dev
          # (needed by libgstreamer1.0-dev).
          sudo apt-get remove -y libunwind-14-dev || true
          sudo apt-get install -y libunwind-dev
          sudo apt-get install -y \
            build-essential clang cmake curl gcc g++ git nasm ninja-build pkg-config \
            autoconf automake libtool python3 rpm unzip wget xz-utils zip \
            libayatana-appindicator3-dev libasound2-dev libclang-dev llvm-dev \
            libdbus-1-dev libglib2.0-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libgtk-3-dev liblzma-dev libpam0g-dev \
            libpulse-dev libva-dev libvdpau-dev libxcb-randr0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxdo-dev libxfixes-dev libssl-dev
          # libopus is built by vcpkg; a system copy confuses the linker.
          sudo apt-get remove -y libopus-dev || true

      # --- Rust toolchain + bridge codegen tool ---
      - name: Set up Rust
        run: |
          rustup default stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo registry + frb tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: cargo-linux-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-linux-

      - name: Install flutter_rust_bridge_codegen
        run: |
          which flutter_rust_bridge_codegen || cargo install --locked flutter_rust_bridge_codegen@1.80.1
          which cargo-expand || cargo install --locked cargo-expand@1.0.95

      # --- Flutter 3.24.5 (git clone so the dropdown patch applies) ---
      - name: Set up Flutter
        run: |
          git clone -b "$FLUTTER_VERSION" --depth 1 https://github.com/flutter/flutter.git "$HOME/flutter-sdk"
          echo "$HOME/flutter-sdk/bin" >> "$GITHUB_PATH"
          "$HOME/flutter-sdk/bin/flutter" config --enable-linux-desktop
          "$HOME/flutter-sdk/bin/flutter" precache --linux
          git -C "$HOME/flutter-sdk" apply "$GITHUB_WORKSPACE/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff" \
            || echo "::warning::dropdown_menu patch did not apply cleanly (may be unneeded on this SDK)"

      # --- vcpkg codec dependencies (cached) ---
      - name: Cache vcpkg installed
        uses: actions/cache@v4
        with:
          path: ~/vcpkg/installed
          key: vcpkg-${{ env.VCPKG_TRIPLET }}-${{ hashFiles('vcpkg.json') }}

      - name: Set up vcpkg + install deps
        run: |
          if [ ! -x "$HOME/vcpkg/vcpkg" ]; then
            # ~/vcpkg/installed may have been restored from the cache: clone
            # elsewhere and copy in so it isn't clobbered.
            rm -rf /tmp/vcpkg-src
            git clone https://github.com/microsoft/vcpkg /tmp/vcpkg-src
            git -C /tmp/vcpkg-src checkout "$(grep -o '[0-9a-f]\{40\}' "$GITHUB_WORKSPACE/vcpkg.json" | head -1)"
            mkdir -p "$HOME/vcpkg"
            cp -R /tmp/vcpkg-src/. "$HOME/vcpkg/"
            "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          fi
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"
          cd "$GITHUB_WORKSPACE"
          "$HOME/vcpkg/vcpkg" install --triplet "$VCPKG_TRIPLET" --x-install-root="$HOME/vcpkg/installed"

      - name: Upload vcpkg logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs
          path: ~/vcpkg/buildtrees/**/*.log
          if-no-files-found: ignore

      # ffigen (run by the bridge codegen) needs flutter/.dart_tool first.
      - name: flutter pub get
        run: |
          cd flutter
          flutter pub get

      - name: Bridge codegen
        run: |
          flutter_rust_bridge_codegen \
            --rust-input src/flutter_ffi.rs \
            --dart-output flutter/lib/generated_bridge.dart \
            --c-output flutter/macos/Runner/bridge_generated.h

      # --- Build the app + .deb ---
      - name: Build Tether Linux
        run: |
          export VCPKG_ROOT="$HOME/vcpkg"
          python3 build.py --flutter --hwcodec

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: tether-linux-x86_64
          path: tether-*.deb
          if-no-files-found: error
